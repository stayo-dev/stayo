<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon set ─────────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Google Fonts (legacy public sub-page theme) ────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" />

    <!-- ── Google Fonts (Stayo marketing theme) ────────────────────────
         Loaded via <link>, not a CSS @import — a CSS @import must be the
         first statement in its stylesheet, which tokens/fonts.css can't
         guarantee once it's nested inside globals.css's import chain (it
         silently gets dropped by the browser otherwise). Same pattern the
         legacy fonts above already use, for the same reason. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />

    <!-- ── Canonical ──────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://yourstayo.com/" />

    <!-- ── Primary SEO ────────────────────────────────────────────────── -->
    <title>Stayo | Hostel Management Platform by Trishul Solutions</title>
    <meta name="description"
      content="Stayo is an AI-powered hostel and PG management platform — a verified marketplace for students and complete rent, tenant, and operations automation for owners. Developed and operated by Trishul Solutions." />
    <meta name="keywords"
      content="Stayo, hostel management platform, PG management software, rent collection software, tenant management, hostel marketplace, Trishul Solutions" />
    <meta name="author" content="Trishul Solutions" />
    <meta name="publisher" content="Trishul Solutions" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#a45d44" />
    <meta name="apple-mobile-web-app-title" content="Stayo" />
    <meta name="application-name" content="Stayo" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Open Graph ─────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourstayo.com/" />
    <meta property="og:site_name" content="Stayo" />
    <meta property="og:title" content="Stayo | Hostel Management Platform by Trishul Solutions" />
    <meta property="og:description"
      content="A verified hostel marketplace for students and complete operations automation for owners. Stayo is developed and operated by Trishul Solutions." />
    <meta property="og:image" content="https://yourstayo.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stayo — Stay Operations Platform by Trishul Solutions" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter / X Card ───────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stayo | Hostel Management Platform by Trishul Solutions" />
    <meta name="twitter:description"
      content="A verified hostel marketplace for students and complete operations automation for owners. Developed and operated by Trishul Solutions." />
    <meta name="twitter:image" content="https://yourstayo.com/og-cover.png" />

    <!-- ── Structured Data — Organization (JSON-LD) ──────────────────
         Minimal by design: company identity + Stayo as its brand. No
         address / registration / other business details exposed here. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Trishul Solutions",
      "url": "https://yourstayo.com",
      "logo": "https://yourstayo.com/android-chrome-512x512.png",
      "email": "contact@yourstayo.com",
      "telephone": "+91 76750 80090",
      "brand": {
        "@type": "Brand",
        "name": "Stayo"
      }
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

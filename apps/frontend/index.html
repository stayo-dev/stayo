    <!-- ── Boot splash ──────────────────────────────────────────────────
         The Stayo loading screen, rendered by the HTML parser before a single
         byte of JS or CSS has arrived — otherwise the app shows a blank page
         for the whole bundle download. `main.tsx` removes #stayo-boot once
         React commits, handing over to <StayoLoadingScreen />, which is the
         same screen: same palette, same layout, same window sequence, so the
         handover is invisible.

         Values here MUST stay in sync with
         src/shared/ui/brand/stayo-loading.css. This copy is duplicated on
         purpose — it cannot import anything. -->
    <style>
      html, body { height: 100%; margin: 0; } #root { height: 100%; }
      #stayo-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: clamp(30px, 5vw, 48px); padding: 40px 24px; overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 116%, rgba(180,106,85,.16), transparent 60%),
          linear-gradient(180deg, #fbf7f1 0%, #f1e4d2 100%);
        transition: opacity .32s ease;
      }
      #stayo-boot[data-leaving='true'] { opacity: 0; pointer-events: none; }
      #stayo-boot .glow {
        position: absolute; left: 50%; top: 44%; width: min(72vw, 560px); aspect-ratio: 1;
        transform: translate(-50%, -50%); border-radius: 50%; filter: blur(4px); opacity: .15;
        background: radial-gradient(circle, rgba(244,166,90,.65) 0%, rgba(244,166,90,.16) 34%, transparent 66%);
        animation: stayo-boot-glow 7.2s ease-in-out infinite;
      }
      #stayo-boot .mark {
        position: relative; z-index: 2; width: clamp(122px, 21vw, 186px); height: auto;
        overflow: visible; fill: #c0552f; opacity: 0; transform: translateY(10px) scale(.96);
        animation: stayo-boot-rise .8s cubic-bezier(.2,.7,.2,1) .1s forwards;
      }
      #stayo-boot .pane { animation: stayo-boot-pane 7.2s linear infinite; }
      #stayo-boot .pane:nth-of-type(1) { animation-delay: .75s; }
      #stayo-boot .pane:nth-of-type(2) { animation-delay: .23s; }
      #stayo-boot .pane:nth-of-type(3) { animation-delay: -.29s; }
      #stayo-boot .pane:nth-of-type(4) { animation-delay: -.81s; }
      #stayo-boot .track {
        position: relative; z-index: 2; width: clamp(190px, 42vw, 244px); height: 6px;
        border-radius: 99px; background: rgba(180,106,85,.16); overflow: hidden;
      }
      #stayo-boot .fill {
        height: 100%; width: 0; border-radius: 99px;
        background: linear-gradient(90deg, #b46a55, #d2986c);
        animation: stayo-boot-fill 7.2s cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes stayo-boot-rise { to { opacity: 1; transform: none; } }
      @keyframes stayo-boot-pane {
        0%, 10.3% { fill: #c0552f; filter: none; }
        10.4%, 72.8% { fill: #f4a65a; filter: drop-shadow(0 0 4px rgba(244,166,90,.65)) drop-shadow(0 0 12px rgba(244,166,90,.65)); }
        72.9%, 92.3% { fill: #ffc98a; filter: drop-shadow(0 0 7px #ffc98a) drop-shadow(0 0 20px rgba(244,166,90,.65)); }
        100% { fill: #c0552f; filter: none; }
      }
      @keyframes stayo-boot-glow { 0% { opacity: .14 } 32% { opacity: .46 } 73% { opacity: .72 } 92% { opacity: .5 } 100% { opacity: .14 } }
      @keyframes stayo-boot-fill { 0% { width: 0 } 73.6%, 100% { width: 100% } }
      @media (prefers-reduced-motion: reduce) {
        #stayo-boot .mark { animation: none; opacity: 1; transform: none; }
        #stayo-boot .pane { animation: none; fill: #f4a65a; }
        #stayo-boot .glow { animation: none; opacity: .42; }
        #stayo-boot .fill { animation: none; width: 40%; }
      }
    </style>

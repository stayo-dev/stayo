<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon set ─────────────────────────────────────────────────── -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- ── Google Fonts (legacy Shri Adithya theme) ───────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" />

    <!-- ── Google Fonts (StayO theme) ──────────────────────────────────
         Loaded via <link>, not a CSS @import — a CSS @import must be the
         first statement in its stylesheet, which tokens/fonts.css can't
         guarantee once it's nested inside globals.css's import chain (it
         silently gets dropped by the browser otherwise). Same pattern the
         legacy fonts above already use, for the same reason. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />

    <!-- ── Canonical ──────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://www.sriadithyahostels.in/" />

    <!-- ── Primary SEO ────────────────────────────────────────────────── -->
    <title>Stayo</title>

      content="Sri Adithya Boys Hostel offers safe, affordable student accommodation in Hyderabad with furnished rooms, nutritious meals, 24/7 security, and modern facilities. Enquire now." />

name: Backend Keep-Warm

# ─────────────────────────────────────────────────────────────────────────────
# Vercel Hobby serverless functions spin down after a period of no traffic.
# The next real visitor then pays a ~1.5-2s cold-start tax (function boot +
# first DB connection) before the backend responds — felt as the site
# "hanging" right after opening it.
#
# This workflow pings the public, side-effect-free /api/health endpoint
# (which also runs `SELECT 1` against the DB, so it warms the DB connection
# too) often enough that the function rarely gets the chance to go cold.
#
# Vercel's own Cron Jobs are capped at once/day on the Hobby plan (see
# backend-cron.yml), so this uses GitHub Actions scheduling instead — no
# Vercel plan change needed. Reuses the same `vars.BACKEND_URL` repo
# variable as backend-cron.yml.
#
# Note: scheduled workflows are auto-disabled after 60 days with no repo
# activity; a push re-enables them (same caveat as backend-cron.yml).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -uo pipefail
          BASE="${BACKEND_URL:-https://api.yourstayo.com}"
          BASE="${BASE%/}"
          url="$BASE/api/health"
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 20 "$url")
          echo "GET $url -> HTTP $code"
          head -c 300 /tmp/resp.txt 2>/dev/null || true; echo
          case "$code" in
            2*) echo "✓ warm" ;;
            *)  echo "::warning::health check returned $code" ;;
          esac

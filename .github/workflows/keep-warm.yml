name: Backend Keep-Warm

# ─────────────────────────────────────────────────────────────────────────────
# Vercel Hobby serverless functions spin down after a period of no traffic.
# The next real visitor then pays a ~1.5-2s cold-start tax (function boot +
# first DB connection) before the backend responds — felt as the site
# "hanging" right after opening it.
#
# This workflow pings the public, side-effect-free /api/health endpoint
# (which also runs `SELECT 1` against the DB, so it warms the DB connection
# too) often enough that the function rarely gets the chance to go cold.
#
# Vercel's own Cron Jobs are capped at once/day on the Hobby plan, and a
# sub-daily schedule fails the deployment outright rather than degrading — so
# a 5-minute ping cannot be a Vercel cron while the account is on Hobby. This
# is therefore the LAST remaining GitHub Actions schedule in the repo: all six
# business crons moved into apps/backend/vercel.json on 2026-09-08 (ADR-179)
# and backend-cron.yml was deleted.
#
# Requires repo variable BACKEND_URL (Settings → Secrets and variables →
# Actions), falling back to https://api.yourstayo.com if unset. No secret
# needed — /api/health is public.
#
# Note: scheduled workflows are auto-disabled after 60 days with no repo
# activity; a push re-enables them. That now costs only cold-start latency,
# not a missed business job.
#
# On upgrading to Vercel Pro (per-minute cron precision and frequency), this
# can move into vercel.json too, and the repo stops depending on GitHub for
# scheduling entirely.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -uo pipefail
          BASE="${BACKEND_URL:-https://api.yourstayo.com}"
          BASE="${BASE%/}"
          url="$BASE/api/health"
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 20 "$url")
          echo "GET $url -> HTTP $code"
          head -c 300 /tmp/resp.txt 2>/dev/null || true; echo
          case "$code" in
            2*) echo "✓ warm" ;;
            *)  echo "::warning::health check returned $code" ;;
          esac

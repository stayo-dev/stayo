name: Backend Cron (Vercel Hobby overflow)

# ─────────────────────────────────────────────────────────────────────────────
# Vercel Hobby (free) allows only 2 cron jobs, once per day each. The 2 most
# critical ones (generate-rent, rent-reminders) run via Vercel Cron — see
# apps/backend/vercel.json. This workflow covers the OTHER 4 jobs in the MVP
# cron set so the full schedule works on the free tier.
#
# The MVP set is deliberately small (see docs/operations/cron-registry.md).
# Every other /api/cron/* route still exists and is still CRON_SECRET-gated,
# but is intentionally UNSCHEDULED — do not add one back here without adding
# it to the registry first.
#
# ORDERING MATTERS: move-out-releases runs at 18:00 UTC, a full 30 minutes
# BEFORE generate-rent (18:30 UTC, on Vercel). generate-rent bills every
# allocation whose tenant is still ACTIVE and has no move-out awareness of its
# own, while move-out-releases is what flips a past-exit-date tenant to
# FORMER_TENANT. Running them in the other order bills tenants who have
# already left. Do not move either without re-reading that pair.
#
# Each run GETs a CRON_SECRET-protected /api/cron/* endpoint exactly the way
# Vercel Cron does: header `Authorization: Bearer <CRON_SECRET>`.
#
# Required repo config — Settings → Secrets and variables → Actions:
#   • Secret   CRON_SECRET   — same value as the backend's CRON_SECRET env var
#   • Variable BACKEND_URL   — e.g. https://api.yourstayo.com
#                              (falls back to https://api.yourstayo.com if unset)
#
# Notes:
#   • GitHub scheduled runs are best-effort and can be delayed a few minutes
#     under load — fine for these daily jobs, not for second-level precision.
#     The 30-minute move-out → rent-generation gap exists to absorb that.
#   • Scheduled workflows are auto-disabled after 60 days with no repo activity;
#     a push re-enables them.
#   • On upgrading to Vercel Pro: move these back into vercel.json's `crons`
#     (Pro allows 40) and delete/disable this workflow — keeping the ordering
#     constraint above intact.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: Run one endpoint now (or "all")
        type: choice
        default: all
        options:
          - all
          - move-out-releases
          - reconcile-payments
          - invitation-expiry-reminders
          - expire-unaccepted-tenancies
  schedule:
    - cron: "0 18 * * *"   # move-out-releases          (23:30 IST) — before generate-rent
    - cron: "0 3 * * *"    # invitation-expiry-reminders (08:30 IST)
    - cron: "30 3 * * *"   # reconcile-payments          (09:00 IST)
    - cron: "0 4 * * *"    # expire-unaccepted-tenancies (09:30 IST) — 1h after the reminder

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve endpoints for this trigger
        id: resolve
        env:
          # A scheduled run exposes the exact cron string that fired.
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_ENDPOINT: ${{ github.event.inputs.endpoint }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_ENDPOINT" = "all" ]; then
              EP="move-out-releases invitation-expiry-reminders reconcile-payments expire-unaccepted-tenancies"
            else
              EP="$DISPATCH_ENDPOINT"
            fi
          else
            case "$FIRED_SCHEDULE" in
              "0 18 * * *")  EP="move-out-releases" ;;
              "0 3 * * *")   EP="invitation-expiry-reminders" ;;
              "30 3 * * *")  EP="reconcile-payments" ;;
              "0 4 * * *")   EP="expire-unaccepted-tenancies" ;;
              *)             EP="" ;;
            esac
          fi
          echo "endpoints=$EP" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${EP:-<none>}"

      - name: Call cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          ENDPOINTS: ${{ steps.resolve.outputs.endpoints }}
        run: |
          set -uo pipefail
          BASE="${BACKEND_URL:-https://api.yourstayo.com}"
          BASE="${BASE%/}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set"; exit 1
          fi
          if [ -z "${ENDPOINTS:-}" ]; then
            echo "No endpoint resolved for this trigger — nothing to do."; exit 0
          fi
          fail=0
          for ep in $ENDPOINTS; do
            url="$BASE/api/cron/$ep"
            echo "→ GET $url"
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" "$url"); rc=$?
            if [ $rc -ne 0 ]; then code="000"; fi
            echo "  HTTP $code (curl rc=$rc)"
            head -c 500 /tmp/resp.txt 2>/dev/null || true; echo
            case "$code" in
              2*) echo "  ✓ $ep ok" ;;
              *)  echo "::error::$ep returned $code"; fail=1 ;;
            esac
          done
          exit $fail
